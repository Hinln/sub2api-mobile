name: Build native Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Gradle variant to assemble
        required: true
        default: release
        type: choice
        options:
          - debug
          - release
      artifact:
        description: Native output type
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # Expo SDK 54 prebuild currently resolves these values from the
          # React Native/Expo version catalog. Keep the runner explicit so a
          # fresh machine can compile without relying on a prewarmed SDK.
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm dlx expo-doctor@1.20.4

      - name: Generate Android project
        run: pnpm run native:prebuild:android

      - name: Assemble native Android artifact
        shell: bash
        run: |
          chmod +x android/gradlew
          case "${{ inputs.artifact }}:${{ inputs.variant }}" in
            apk:debug) task=assembleDebug ;;
            apk:release) task=assembleRelease ;;
            aab:release) task=bundleRelease ;;
            *) echo "Unsupported variant" >&2; exit 1 ;;
          esac
          (cd android && ./gradlew ":app:${task}" --no-daemon --stacktrace)

      - name: Resolve native artifact path
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.artifact }}" == "aab" ]]; then
            path='android/app/build/outputs/bundle/release/*'
          else
            path="android/app/build/outputs/apk/${{ inputs.variant }}/*"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          compgen -G "$path" >/dev/null || {
            echo "No native artifact matched $path" >&2
            exit 1
          }

      - name: Upload native Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexlune-android-${{ inputs.artifact }}-${{ inputs.variant }}-${{ github.sha }}
          # Gradle writes APKs under outputs/apk and bundles under
          # outputs/bundle. Keep the upload path aligned with the task above.
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30
