name: Build native unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm dlx expo-doctor@1.20.4

      - name: Read app metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./app.json').expo.version")"
          build_number="$(node -p "require('./app.json').expo.ios.buildNumber")"
          {
            echo "version=$version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"
          echo "Building Vexlune Mobile Console $version ($build_number)"

      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: pod install --project-directory=ios

      - name: Discover workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          # Restrict discovery to ios/ itself: an .xcodeproj contains its own
          # project.xcworkspace, which omits the CocoaPods integration.
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -not -path '*/Pods/*' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace found" >&2
            exit 1
          fi
          project_name="$(basename "$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)" .xcodeproj)"
          if [[ -z "$project_name" ]]; then
            echo "No application Xcode project found" >&2
            exit 1
          fi
          xcodebuild -workspace "$workspace" -list -json > /tmp/xcode-list.json
          scheme="$(ruby -rjson -e 'j=JSON.parse(File.read("/tmp/xcode-list.json")); expected=ARGV.fetch(0); schemes=j.dig("workspace","schemes") || []; abort("Application scheme #{expected} not found") unless schemes.include?(expected); puts expected' "$project_name")"
          if [[ -z "$scheme" ]]; then
            echo "No application scheme found" >&2
            cat /tmp/xcode-list.json
            exit 1
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Workspace: $workspace"
          echo "Scheme: $scheme"

      - name: Build Release for iPhoneOS without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          ipa_name="Vexlune-Mobile-Console-v${{ steps.metadata.outputs.version }}-ios-unsigned.ipa"
          app_zip_name="Vexlune-Mobile-Console-v${{ steps.metadata.outputs.version }}-ios-app.zip"
          app="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [[ -z "$app" ]]; then
            echo "Release iPhoneOS .app not found" >&2
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          architecture="$(file "$app/$executable")"
          echo "$architecture" | grep -q 'arm64' || { echo "Main executable is not arm64" >&2; exit 1; }

          find "$app" -name '_CodeSignature' -type d -prune -exec rm -rf {} +
          find "$app" -name 'embedded.mobileprovision' -type f -delete
          mkdir -p dist/ios/Payload
          cp -R "$app" dist/ios/Payload/Vexlune.app
          (cd dist/ios && zip -qry "$ipa_name" Payload)
          (cd dist/ios && ditto -c -k --sequesterRsrc --keepParent Payload/Vexlune.app "$app_zip_name")

          unzip -t "dist/ios/$ipa_name"
          plutil -p dist/ios/Payload/Vexlune.app/Info.plist
          if codesign -dv --verbose=4 dist/ios/Payload/Vexlune.app 2>/tmp/codesign.txt; then
            echo "Unexpected signature found" >&2
            cat /tmp/codesign.txt
            exit 1
          fi
          test ! -e dist/ios/Payload/Vexlune.app/embedded.mobileprovision
          shasum -a 256 "dist/ios/$ipa_name" "dist/ios/$app_zip_name" > dist/ios/SHA256SUMS

          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/ios/Payload/Vexlune.app/Info.plist)"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ios/Payload/Vexlune.app/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/ios/Payload/Vexlune.app/Info.plist)"
          cat > dist/ios/BUILD_INFO.md <<EOF
          # Vexlune iOS Build Info

          - Commit: $GITHUB_SHA
          - Runner: $RUNNER_OS / $ImageOS
          - Workspace: ${{ steps.xcode.outputs.workspace }}
          - Scheme: ${{ steps.xcode.outputs.scheme }}
          - Configuration: Release
          - SDK: iPhoneOS
          - Architecture: $architecture
          - Bundle ID: $bundle_id
          - Version: $version ($build)
          - Signing: unsigned; CODE_SIGNING_ALLOWED=NO
          EOF
          cp docs/SIGNING_GUIDE.md docs/TEST_REPORT.md docs/SECURITY_REVIEW.md docs/BILLING_FIELD_AUDIT.md docs/API_AUDIT.md docs/BACKEND_GAPS.md docs/CHANGELOG.md docs/mobile/APP_STORE_CONNECT_CHECKLIST.md docs/mobile/RELEASE_RUNBOOK.md docs/mobile/ROLLBACK_RUNBOOK.md dist/ios/

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vexlune-ios-unsigned-v${{ steps.metadata.outputs.version }}-b${{ steps.metadata.outputs.build_number }}
          path: |
            dist/ios/Vexlune-Mobile-Console-v${{ steps.metadata.outputs.version }}-ios-unsigned.ipa
            dist/ios/Vexlune-Mobile-Console-v${{ steps.metadata.outputs.version }}-ios-app.zip
            dist/ios/SHA256SUMS
            dist/ios/*.md
          if-no-files-found: error
          retention-days: 30
