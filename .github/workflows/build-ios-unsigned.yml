name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "1"
      APP_DISPLAY_NAME: Hub Vexlune
      APP_BUNDLE_ID: com.vexlune.mobile
      APP_VERSION: "1.0.2"
      APP_BUILD_NUMBER: "3"
      APP_BUNDLE_DIR: HubVexlune.app
      IPA_NAME: Hub-Vexlune-v1.0.2-ios-unsigned.ipa
      APP_ZIP_NAME: Hub-Vexlune-v1.0.2-ios-app.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate source
        run: |
          node <<'NODE'
          const app = require('./app.json').expo;
          const pkg = require('./package.json');
          const expected = {
            name: process.env.APP_DISPLAY_NAME,
            bundleIdentifier: process.env.APP_BUNDLE_ID,
            version: process.env.APP_VERSION,
            buildNumber: process.env.APP_BUILD_NUMBER,
          };
          const actual = {
            name: app.name,
            bundleIdentifier: app.ios.bundleIdentifier,
            version: app.version,
            buildNumber: app.ios.buildNumber,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (actual[key] !== value) {
              throw new Error(`${key} mismatch: expected ${value}, received ${actual[key]}`);
            }
          }
          if (pkg.version !== expected.version) {
            throw new Error(`package version mismatch: expected ${expected.version}, received ${pkg.version}`);
          }
          NODE
          npm run typecheck
          npm run lint
          npm test
          npx expo-doctor

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Discover workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          # Restrict discovery to ios/ itself: an .xcodeproj contains its own
          # project.xcworkspace, which omits the CocoaPods integration.
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -not -path '*/Pods/*' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace found" >&2
            exit 1
          fi
          project_name="$(basename "$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)" .xcodeproj)"
          if [[ -z "$project_name" ]]; then
            echo "No application Xcode project found" >&2
            exit 1
          fi
          xcodebuild -workspace "$workspace" -list -json > /tmp/xcode-list.json
          scheme="$(ruby -rjson -e 'j=JSON.parse(File.read("/tmp/xcode-list.json")); expected=ARGV.fetch(0); schemes=j.dig("workspace","schemes") || []; abort("Application scheme #{expected} not found") unless schemes.include?(expected); puts expected' "$project_name")"
          if [[ -z "$scheme" ]]; then
            echo "No application scheme found" >&2
            cat /tmp/xcode-list.json
            exit 1
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Workspace: $workspace"
          echo "Scheme: $scheme"

      - name: Build Release for iPhoneOS without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 2 -name '*.app' -type d -print -quit)"
          if [[ -z "$app" ]]; then
            echo "Release iPhoneOS .app not found" >&2
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          architecture="$(file "$app/$executable")"
          echo "$architecture" | grep -q 'arm64' || { echo "Main executable is not arm64" >&2; exit 1; }

          find "$app" -name '_CodeSignature' -type d -prune -exec rm -rf {} +
          find "$app" -name 'embedded.mobileprovision' -type f -delete
          mkdir -p dist/ios/Payload
          packaged_app="dist/ios/Payload/$APP_BUNDLE_DIR"
          cp -R "$app" "$packaged_app"
          (cd dist/ios && zip -qry "$IPA_NAME" Payload)
          (cd dist/ios && ditto -c -k --sequesterRsrc --keepParent "Payload/$APP_BUNDLE_DIR" "$APP_ZIP_NAME")

          unzip -t "dist/ios/$IPA_NAME"
          plutil -p "$packaged_app/Info.plist"
          if codesign -dv --verbose=4 "$packaged_app" 2>/tmp/codesign.txt; then
            echo "Unexpected signature found" >&2
            cat /tmp/codesign.txt
            exit 1
          fi
          test ! -e "$packaged_app/embedded.mobileprovision"
          shasum -a 256 "dist/ios/$IPA_NAME" "dist/ios/$APP_ZIP_NAME" > dist/ios/SHA256SUMS

          display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$packaged_app/Info.plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$packaged_app/Info.plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$packaged_app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$packaged_app/Info.plist")"
          [[ "$display_name" == "$APP_DISPLAY_NAME" ]] || { echo "Display name mismatch: $display_name" >&2; exit 1; }
          [[ "$bundle_id" == "$APP_BUNDLE_ID" ]] || { echo "Bundle ID mismatch: $bundle_id" >&2; exit 1; }
          [[ "$version" == "$APP_VERSION" ]] || { echo "Version mismatch: $version" >&2; exit 1; }
          [[ "$build" == "$APP_BUILD_NUMBER" ]] || { echo "Build number mismatch: $build" >&2; exit 1; }
          cat > dist/ios/BUILD_INFO.md <<EOF
          # Hub Vexlune iOS Build Info

          - Commit: $GITHUB_SHA
          - Runner: $RUNNER_OS / $ImageOS
          - Workspace: ${{ steps.xcode.outputs.workspace }}
          - Scheme: ${{ steps.xcode.outputs.scheme }}
          - Configuration: Release
          - SDK: iPhoneOS
          - Architecture: $architecture
          - App: $display_name
          - Bundle ID: $bundle_id
          - Version: $version ($build)
          - Signing: unsigned; CODE_SIGNING_ALLOWED=NO
          EOF
          cp design-qa.md docs/SIGNING_GUIDE.md docs/RELEASE_GUIDE.md docs/BUILD_BLOCKERS.md docs/TEST_REPORT.md docs/SECURITY_REVIEW.md docs/BILLING_FIELD_AUDIT.md docs/API_AUDIT.md docs/BACKEND_GAPS.md docs/CHANGELOG.md dist/ios/

      - name: Upload unsigned iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hub-vexlune-ios-unsigned-v1.0.2
          path: |
            dist/ios/Hub-Vexlune-v1.0.2-ios-unsigned.ipa
            dist/ios/Hub-Vexlune-v1.0.2-ios-app.zip
            dist/ios/SHA256SUMS
            dist/ios/*.md
          if-no-files-found: error
          retention-days: 30
